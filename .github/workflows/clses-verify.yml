name: CLSES verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clses-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the pinned local kernel
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Verify release scaffold or governed workspace
        run: python -m clses_mvas_v1.template_edition check
      - name: Test starter system
        run: python -m unittest discover -s tests -v
      - name: Test assurance kernel
        run: python -m unittest discover -s kernel_tests -v
